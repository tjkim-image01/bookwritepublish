<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>그림책 서재</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M3 7c5-2 9-1 13 2 4-3 8-4 13-2v19c-5-2-9-1-13 2-4-3-8-4-13-2z%22 fill=%22%23b5532d%22/%3E%3C/svg%3E">
  <style>
    @font-face { font-family: NSR; src: url('v1/fonts/NanumSquareRoundR.ttf'); }
    @font-face { font-family: NSR; font-weight: 800; src: url('v1/fonts/NanumSquareRoundEB.ttf'); }
    :root { --ink: #3b2a1a; --accent: #b5532d; --card: rgba(255, 250, 240, .9); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
           font-family: NSR, 'Apple SD Gothic Neo', sans-serif; color: var(--ink);
           background: radial-gradient(ellipse at 50% 30%, #f6ecd9 0%, #ead9bb 55%, #d9c3a0 100%); }
    main { width: min(720px, 100%); text-align: center; }
    h1 { margin: 0 0 6px; font-weight: 800; font-size: clamp(26px, 6vw, 36px); color: var(--accent); }
    p.sub { margin: 0 0 28px; opacity: .7; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    a.card { display: block; padding: 22px 20px; border-radius: 18px; background: var(--card); color: inherit; text-decoration: none;
             border: 2px solid transparent; box-shadow: 0 6px 24px rgba(70, 40, 10, .12); transition: transform .15s, border-color .15s; text-align: left; }
    a.card:hover { transform: translateY(-2px); border-color: rgba(181, 83, 45, .35); }
    a.card b { display: block; font-weight: 800; font-size: 20px; color: var(--accent); margin-bottom: 6px; }
    a.card span { font-size: 14px; line-height: 1.6; opacity: .8; }
    a.card .tag { display: none; float: right; font-size: 12px; font-weight: 800; color: #fff8ea; background: var(--accent); border-radius: 999px; padding: 3px 10px; opacity: 1; }
    @media (max-aspect-ratio: 9/10) { a.card.v2 { border-color: var(--accent); } a.card.v2 .tag { display: inline-block; } }
    footer { margin-top: 28px; font-size: 12px; opacity: .55; }
  </style>
</head>
<body>
  <main>
    <h1>그림책 서재</h1>
    <p class="sub">성경 이야기 어린이 그림동화 · 펼쳐 보고, 넘기고, 들어 보세요</p>
    <div class="cards">
      <a class="card v1" href="v1/"><b>v1 · 펼침면 보기</b><span>PC·태블릿 가로 화면용. 펼친 책 두 쪽을 함께 보고, 눕혀 보기 모드도 있어요.</span></a>
      <a class="card v2" href="v2/"><span class="tag">휴대폰 추천</span><b>v2 · 모바일 대응</b><span>휴대폰 세로 화면에서는 한 쪽씩 크게, 좌우로 밀어 넘겨요. 가로·PC 에서는 v1 처럼 펼침면.</span></a>
    </div>
    <footer>글꼴 나눔스퀘어라운드 (SIL OFL 1.1) · 3D three.js (MIT)</footer>
  </main>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>그림책 서재</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M3 7c5-2 9-1 13 2 4-3 8-4 13-2v19c-5-2-9-1-13 2-4-3-8-4-13-2z%22 fill=%22%23b5532d%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/viewer.css">
</head>
<body>
  <canvas id="stage"></canvas>

  <header id="shelf-head">
    <h1>그림책 서재</h1>
    <p>책을 눌러 펼쳐 보세요</p>
  </header>
  <div id="labels"></div>

  <div id="loading" hidden><div class="spinner"></div><span>책을 펼치는 중…</span></div>

  <div id="hint" hidden></div>

  <nav id="player" hidden aria-label="책 플레이어">
    <div class="row top">
      <span id="pg-label">표지</span>
      <span id="pg-count">0 / 0</span>
    </div>
    <div class="row">
      <button id="btn-shelf" title="책장으로 (Esc)" aria-label="책장으로">
        <svg viewBox="0 0 24 24"><path d="M4 5h4v14H4zM10 5h4v14h-4zM16.5 5.6l3.4-.9 3 13.5-3.4.8z" /></svg>
      </button>
      <button id="btn-first" title="처음으로" aria-label="처음으로">
        <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z" /></svg>
      </button>
      <button id="btn-prev" title="앞 장 (←)" aria-label="앞 장">
        <svg viewBox="0 0 24 24"><path d="M16 4v16L5 12z" /></svg>
      </button>
      <button id="btn-play" class="main" title="읽어 주기 (Space)" aria-label="읽어 주기">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z" /></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z" /></svg>
      </button>
      <button id="btn-next" title="다음 장 (→)" aria-label="다음 장">
        <svg viewBox="0 0 24 24"><path d="M8 4v16l11-8z" /></svg>
      </button>
      <div class="progress">
        <span id="t-cur">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="재생 위치">
        <span id="t-dur">0:00</span>
      </div>
      <button id="btn-view" title="눕혀서 보기 (V)" aria-label="보기 모드 바꾸기">
        <svg class="i-front" viewBox="0 0 24 24"><path d="M3 5h8.2v14H3zM12.8 5H21v14h-8.2z" /></svg>
        <svg class="i-desk" viewBox="0 0 24 24"><path d="M6 7h5.3v10H2.5zM12.7 7H18l3.5 10h-8.8z" /></svg>
      </button>
      <label class="toggle" title="장을 넘기면 자동으로 읽어 주기">
        <input id="opt-read" type="checkbox" checked><span>자동 읽기</span>
      </label>
      <label class="toggle" title="다 읽으면 다음 장으로 자동 넘기기">
        <input id="opt-turn" type="checkbox"><span>자동 넘김</span>
      </label>
    </div>
  </nav>

  <audio id="voice" preload="auto"></audio>
  <script type="module" src="js/app.js"></script>
</body>
</html>
